<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corredores - Desafío La Joya</title>
<link rel="stylesheet" href="css/panel-inscripciones.css">
</head>
<body>

<div class="container">
  <h1>Desafío La Joya - Corredores</h1>

  <div class="resumen" id="resumen"></div>

  <div class="barra-acciones">
    <button type="button" class="btn-nuevo" onclick="abrirModalNuevo()">➕ Nuevo corredor</button>
    <button type="button" class="btn-publicar-todos" onclick="publicarTodos(true)">🌐 Publicar todos</button>
    <button type="button" class="btn-ocultar-todos" onclick="publicarTodos(false)">🚫 Ocultar todos</button>
  </div>

  <div class="buscador">
    <input type="text" id="buscar" placeholder="Buscar por apellidos, nombres, grado, unidad, DNI o dorsal...">
    <select id="fDistancia" onchange="aplicarFiltros()">
      <option value="">Todas las distancias</option>
      <option value="5K">5K</option>
      <option value="10K">10K</option>
    </select>
    <select id="fSexo" onchange="aplicarFiltros()">
      <option value="">Varones y Mujeres</option>
      <option value="Varones">Varones</option>
      <option value="Mujeres">Mujeres</option>
    </select>
    <select id="fCategoria" onchange="aplicarFiltros()">
      <option value="">Todas las categorías</option>
      <option value="Libre">Libre</option>
      <option value="Mayores">Mayores</option>
      <option value="Única">Única</option>
    </select>
    <select id="fPublicado" onchange="aplicarFiltros()">
      <option value="">Publicados y sin publicar</option>
      <option value="si">Solo publicados</option>
      <option value="no">Solo sin publicar</option>
    </select>
    <button type="button" class="btn-limpiar" onclick="limpiarFiltros()">Limpiar filtros</button>
    <span class="info-registros" id="infoRegistros"></span>
  </div>

  <div class="tabla-container">
    <div class="loading" id="loading">Cargando datos...</div>
    <table id="tablaCorredores" style="display:none;">
      <thead>
      <tr>
        <th>N°</th>
        <th>APELLIDOS Y NOMBRES</th>
        <th>GRADO</th>
        <th>DISTANCIA</th>
        <th>SEXO</th>
        <th>CATEGORÍA</th>
        <th>UNIDAD</th>
        <th>DORSAL</th>
        <th>PUBLICADO</th>
        <th>ACCIONES</th>
      </tr>
      </thead>
      <tbody id="cuerpoTabla"></tbody>
    </table>
  </div>

  <div class="paginacion" id="paginacion" style="display:none;"></div>
</div>

<div id="overlayGlobal" class="overlay-carga">
  <div class="overlay-content">
    <div class="spinner"></div>
    <p id="mensajeCarga">Procesando...</p>
  </div>
</div>

<!-- MODAL NUEVO / EDITAR CORREDOR -->
<div id="modalCorredor" class="modal">
  <div class="modal-content" style="max-width: 780px;">
    <div class="modal-header">
      <h2 id="tituloModalCorredor">➕ Nuevo corredor</h2>
      <span class="close" onclick="cerrarModalCorredor()">&times;</span>
    </div>
    <div class="modal-body">

      <input type="hidden" id="cId">

      <div class="seccion">
        <div class="seccion-titulo">🌐 Datos que se muestran en la web</div>
        <div class="form-grid">
          <div class="form-group">
            <label for="cApellidos">Apellidos <span class="required">*</span></label>
            <input type="text" id="cApellidos" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="cNombres">Nombres <span class="required">*</span></label>
            <input type="text" id="cNombres" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="cDistancia">Distancia <span class="required">*</span></label>
            <select id="cDistancia">
              <option value="">Seleccione</option>
              <option value="5K">5K</option>
              <option value="10K">10K</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cSexo">Sexo <span class="required">*</span></label>
            <select id="cSexo">
              <option value="">Seleccione</option>
              <option value="Varones">Varones</option>
              <option value="Mujeres">Mujeres</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cCategoria">Categoría <span class="required">*</span></label>
            <select id="cCategoria">
              <option value="">Seleccione</option>
              <option value="Libre">Libre</option>
              <option value="Mayores">Mayores</option>
              <option value="Única">Única</option>
            </select>
          </div>
        </div>
      </div>

      <div class="seccion seccion-privada">
        <div class="seccion-titulo">🔒 Datos privados (no se publican)</div>
        <div class="form-grid">
          <div class="form-group">
            <label for="cGrado">Grado</label>
            <input type="text" id="cGrado" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="cUnidad">Unidad</label>
            <input type="text" id="cUnidad" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="cEdad">Edad</label>
            <input type="number" id="cEdad" min="10" max="99">
          </div>
          <div class="form-group">
            <label for="cDni">DNI</label>
            <input type="text" id="cDni" maxlength="8" inputmode="numeric" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="cTelefono">Teléfono</label>
            <input type="tel" id="cTelefono" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="cTalla">Talla de polo</label>
            <select id="cTalla">
              <option value="">-</option>
              <option value="S">S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
            </select>
          </div>
          <div class="form-group">
            <label for="cDorsal">Dorsal</label>
            <input type="text" id="cDorsal" autocomplete="off">
          </div>
        </div>
      </div>

    </div>
    <div class="modal-footer">
      <button type="button" class="btn-cerrar" onclick="cerrarModalCorredor()">Cancelar</button>
      <button type="button" class="btn-guardar-cabecera" id="btnGuardar" onclick="guardarCorredor(false)">💾 Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL CONFIRMACIÓN -->
<div id="modalConfirmacion" class="modal-confirmacion">
  <div class="modal-confirmacion-content">
    <div class="modal-confirmacion-header">
      <span id="tituloConfirmacion">Confirmar acción</span>
    </div>
    <div class="modal-confirmacion-body">
      <p id="mensajeConfirmacion">¿Está seguro de realizar esta acción?</p>
    </div>
    <div class="modal-confirmacion-footer">
      <button class="btn-confirmar-no" onclick="cerrarConfirmacion(false)">No, cancelar</button>
      <button class="btn-confirmar-si" id="btnConfirmarSi" onclick="cerrarConfirmacion(true)">Sí, continuar</button>
    </div>
  </div>
</div>

<script src="js/panel-inscripciones.js"></script>
</body>
</html>
